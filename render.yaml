services:
  - type: web
    name: navjeevan-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TIMEOUT_SECONDS
        value: "12"
      - key: EXTERNAL_API_TIMEOUT_SECONDS
        value: "15"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CHAT_RATE_LIMIT_REQUESTS
        value: "30"
      - key: EXTERNAL_API_RATE_LIMIT_REQUESTS
        value: "60"